<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no, address=no, email=no">
    <title>2027학년도 아주대학교 수시모집</title>

    <!-- ==================== [Global Resources] ==================== -->
    <!-- ---------------- [Fonts] ---------------- -->
    <link rel="stylesheet" href="https://wzine.kr/ajou_presentation/_css/default.css">

    <!-- ---------------- [Libraries] ---------------- -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* ==================== [CSS Initialization & Variables] ==================== */
        /* ---------------- [CSS Reset] ---------------- */
        html {
            font-size: 1px;
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
        }

        @media (max-width: 1920px) {
            html {
                font-size: calc(100vw / 1920);
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-size: 16rem;
            font-family: 'Pretendard', sans-serif;
            background: #dcedfa url('./images/bg_body.png') no-repeat center top / cover;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            word-break: keep-all;
        }

        *,
        strong,
        *::before,
        *::after {
            box-sizing: border-box;
            font-family: inherit;
            line-height: inherit;
            color: inherit;
        }

        ul,
        ol,
        li {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select,
        textarea {
            border: none;
            background: none;
            padding: 0;
            margin: 0;
            font: inherit;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        button {
            cursor: pointer;
        }

        /* ---------------- [CSS Variables] ---------------- */
        :root {
            --color-primary: #004b87;
            --color-secondary: #002159;
            --color-blue-light: #88B2DF;
            --color-blue-bg: #e6f1f8;
            --color-white: #ffffff;
            --color-black: #111111;
            --color-text-main: #333333;
            --color-text-sub: #666666;

            --font-ajou: 'Ajou', 'Pretendard', sans-serif;
            --shadow-card: 0 8rem 16rem rgba(0, 0, 0, 0.12);
            --shadow-botton: 0 4rem 8rem rgba(0, 0, 0, 0.04);
            --radius-card: 20rem;
        }

        /* ==================== [Layout & Typography] ==================== */
        /* ---------------- [Layout Containers] ---------------- */
        .wrap {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 배경 마스코트 */
        .bg-mascot-bottom {
            position: absolute;
            top: 746rem;
            left: 724rem;
            width: 260rem;
            aspect-ratio: 130 / 107;
            background: url('./images/img_ajou_02.png') no-repeat center bottom / contain;
            pointer-events: none;
            z-index: 100;
            animation: floatMascot 3s ease-in-out infinite;

        }

        @keyframes floatMascot {

            0%,
            100% {
                transform: translateY(0) translateX(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-12rem) translateX(2rem) rotate(1deg);
            }
        }

        .container {
            width: 100%;
            max-width: 1920rem;
            margin: 0 auto;
            padding: 40rem 80rem 60rem;
            position: relative;
            z-index: 10;
        }

        /* ==================== [Components] ==================== */
        /* ---------------- [Header] ---------------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40rem;
        }

        .header-logo img {
            height: 48rem;
        }

        .header-links {
            display: flex;
            gap: 15rem;
        }

        .header-links .btn-pill span {
            font-weight: 400;
        }

        .btn-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 48rem;
            padding: 0 30rem;
            border-radius: 100rem;
            font-size: 16rem;
            font-weight: 700;
            gap: 10rem;
            transition: all 0.3s;
            color: var(--color-white);
        }

        .btn-pill:hover {
            color: var(--color-white);
        }

        .btn-pill.dark {
            background-color: var(--color-secondary);
        }

        .btn-pill.light {
            background-color: var(--color-blue-light);
        }

        .btn-pill:hover {
            box-shadow: 0 5rem 15rem rgba(0, 0, 0, 0.2);
        }

        .btn-pill svg {
            width: 16rem;
            height: 16rem;
        }

        /* ---------------- [Main Grid Layout] ---------------- */
        .main-content {
            display: flex;
            gap: 40rem;
            align-items: stretch;
        }

        /* ---------------- [Left: Boarding Pass] ---------------- */
        .section-boarding-pass {
            flex: 1 1 auto;
            width: 604rem;
            border-radius: 40rem;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: visible;
            z-index: 20;
        }

        .pass-mascot {
            position: absolute;
            bottom: -20rem;
            right: -95rem;
            width: 270rem;
            height: auto;
            pointer-events: none;
            z-index: 2;
        }

        .pass-header {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-top-left-radius: 40rem;
            border-top-right-radius: 40rem;
            padding-right: 16rem;
            height: 128rem;
            position: relative;
            z-index: 10;
        }

        .img-checkin {
            height: 60rem;
            display: block;
        }

        .pass-body {
            padding: 40rem;
            position: relative;
            z-index: 10;
            background: url('./images/bg_sec1_body.png') no-repeat center bottom / cover;
        }

        .pass-title {
            font-size: 36rem;
            font-weight: 800;
            font-family: var(--font-ajou);
            color: #102F65;
            line-height: 1.3;
            margin-bottom: 28rem;
            letter-spacing: -1rem;
        }

        .pass-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16rem;
            margin-bottom: 24rem;
        }

        .btn-pass {
            background: #83A3DA;
            color: var(--color-white);
            height: 100rem;
            padding: 10rem;
            border-radius: 15rem;
            font-size: 20rem;
            line-height: 1.4;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s;
            border: none;
            box-shadow: 0 5rem 15rem rgba(0, 0, 0, 0.1);
        }

        .btn-pass:hover {
            background: #578CE8;
            transform: translateY(-3rem);
            box-shadow: 0 10rem 20rem rgba(0, 0, 0, 0.15);
        }

        .pass-info-list li {
            font-size: 16rem;
            color: #000;
            margin-bottom: 10rem;
            padding-left: 14rem;
            position: relative;
            letter-spacing: -0.5rem;
            line-height: 1.4;
        }

        .pass-info-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #6A7D9C;
        }

        /* 티켓 하단 */
        .pass-footer {
            background: url('./images/bg_sec1_ticket.png') no-repeat center bottom / 100% 100%;
            width: 100%;
            aspect-ratio: 604 / 108;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin-top: auto;
            padding-top: 24rem;
        }

        .pass-footer-title {
            font-size: 18rem;
            font-weight: 800;
            font-family: var(--font-ajou);
            display: flex;
            align-items: center;
            gap: 10rem;
            color: #333333;
        }

        .pass-footer-title svg {
            width: 24rem;
            height: 24rem;
        }

        /* ---------------- [Center: Quick Links] ---------------- */
        .section-center-links {
            flex: 1 1 auto;
            width: 260rem;
            display: flex;
            flex-direction: column;
            gap: 15rem;
            z-index: 10;
        }

        .card-sm {
            background: var(--color-white);
            border-radius: var(--radius-card);
            padding: 24rem;
            height: 120rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            transition: all 0.3s;
            position: relative;
            border: 2px solid transparent;
            color: var(--color-black);
        }

        .card-sm .text {
            font-size: 18rem;
            font-weight: 700;
            color: inherit;
            line-height: 28rem;
            letter-spacing: -0.5rem;
        }

        .card-sm .text .badge {
            display: inline-block;
            background: #FFF4E9;
            color: #F79433;
            font-size: 12rem;
            line-height: 16rem;
            padding: 2rem 10rem;
            border-radius: 16rem;
            font-weight: 500;
        }

        .card-sm .text-sub {
            font-size: 14rem;
            line-height: 20rem;
            color: inherit;
            font-weight: 400;
            display: block;
        }

        .card-sm .text-large {
            color: inherit;
            font-size: 18rem;
            line-height: 28rem;
            font-weight: 700;
            font-family: var(--font-ajou);
        }

        .card-sm svg {
            position: absolute;
            top: 12rem;
            right: 12rem;
            width: 16rem;
            height: 16rem;
            color: #999;
        }

        .card-sm:hover {
            border-color: #005BAC;
            color: var(--color-primary);
            box-shadow: var(--shadow-card);
        }

        .card-sm:hover svg {
            color: inherit;
        }

        /* ---------------- [Right: Board & Banners] ---------------- */
        .section-right {
            flex: 1 1 auto;
            width: 810rem;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20rem;
            z-index: 10;
        }

        /* 슬라이드 배너 영역 (Swiper) */
        .board-restructure {
            border-radius: var(--radius-card);
            overflow: hidden;
            position: relative;
            width: 100%;
            aspect-ratio: 816/328;
        }

        .board-restructure .swiper {
            width: 100%;
            height: 100%;
        }

        .board-restructure .swiper-slide {
            position: relative;
            width: 100% !important;
            height: 100%;
        }

        .board-restructure .swiper-slide .btn-pill {
            position: absolute;
            right: 0;
            bottom: 0;
            padding: 14rem 18rem;
            font-size: 14rem;
            font-weight: 400;
            gap: 4rem;
        }

        .board-restructure .swiper-slide img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Swiper Controls Customization */
        .swiper-custom-controls {
            position: absolute;
            bottom: 30rem;
            left: 40rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 15rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 8rem 12rem;
            border-radius: 30rem;
            backdrop-filter: blur(4px);
        }

        .swiper-custom-controls button {
            color: var(--color-white);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        .swiper-custom-controls button:hover {
            opacity: 0.7;
        }

        .swiper-custom-controls button.btn-prev svg,
        .swiper-custom-controls button.btn-next svg {
            width: 24rem;
            height: 24rem;
        }

        .swiper-custom-controls button.btn-playpause svg {
            width: 12rem;
            height: 12rem;
        }

        .swiper-pagination {
            position: static !important;
            display: flex;
            align-items: center;
            gap: 16rem;
            width: auto !important;
        }

        .swiper-pagination-bullet {
            width: 10rem;
            height: 10rem;
            background: rgba(255, 255, 255, 0.4);
            opacity: 1;
            margin: 0 !important;
        }

        .swiper-pagination-bullet-active {
            background: var(--color-white);
        }

        /* Swiper SVG Icons */
        .icon-play,
        .icon-pause {
            display: none;
        }

        .btn-playpause.is-playing .icon-pause {
            display: block;
        }

        .btn-playpause:not(.is-playing) .icon-play {
            display: block;
        }

        .board-links-grid {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid #fff;
            border-radius: var(--radius-card);
            padding: 28rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20rem;
        }

        .link-item {
            position: relative;
            background: transparent;
            padding: 0;
            border: none;
            transition: all 0.3s;
            aspect-ratio: 240 / 110;
            font-weight: 500;
            color: #000;
        }

        .link-item-inner {
            background: url('./images/bg_folder.png') no-repeat center / 100% 100%;
            padding: 38rem 20rem 16rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .link-item-shadow {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 25rem);
            /* 투명영역 높이 제외 */
            border-radius: 0 16rem 16rem 16rem;
            transition: all 0.3s;
            z-index: 1;
        }

        .link-item:hover {
            transform: translateY(-5rem);
            font-weight: 700;
        }

        .link-item:hover .link-item-shadow {
            box-shadow: var(--shadow-botton);
        }

        .link-item span {
            font-size: 18rem;
            line-height: 28rem;
            font-weight: inherit;
            letter-spacing: -0.5rem;
            color: #005EA6;
        }

        .link-item svg {
            width: 24rem;
            height: 24rem;
            margin-bottom: 24rem;
        }

        .bottom-banners {
            display: flex;
            gap: 20rem;
        }

        .banner {
            flex: 1;
            border-radius: var(--radius-card);
            height: 108rem;
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            display: block;
        }

        .banner:hover {
            color: #fff;
            box-shadow: var(--shadow-botton);
        }

        .banner-inner {
            padding: 20rem 30rem;
            height: 100%;
            line-height: 1.4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: calc(var(--radius-card) - 2rem);
            color: var(--color-white);
            position: relative;
            z-index: 2;
        }

        .banner-blue .banner-inner {
            background: url('./images/bg_btn_ai.png') no-repeat right bottom / cover;
            background-color: var(--color-primary);
            border-radius: var(--radius-card);
        }

        .banner-orange {
            padding: 2rem;
            z-index: 1;
        }

        .banner-orange::before {
            --size: 500rem;
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500rem;
            height: 500rem;
            margin-left: calc(var(--size) / -2);
            margin-top: calc(var(--size) / -2);
            background: linear-gradient(180deg, #00D3C8, #FFD900, #0900FF);
            animation: rotateGradient 5s linear infinite;
            z-index: -1;
        }

        .banner-orange .banner-inner {
            background: url('./images/bg_btn_test.png') no-repeat right bottom / cover;
            background-color: #d97736;
        }

        @keyframes rotateGradient {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .banner-title {
            font-size: 22rem;
            font-weight: 700;
            font-family: var(--font-ajou);
        }

        .banner-btn {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            width: 62rem;
            height: 62rem;
            font-size: 12rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--color-white);
            flex-shrink: 0;
        }

        /* ==================== [Responsive Design] ==================== */
        @media (max-width: 1280px) {
            html {
                font-size: calc(120vw / 1280);
                /* font-size: 1px; */
            }
            body {
                background-color: #CFE6F5;
            }
            .container {
                padding-left: 60rem;
                padding-right: 60rem;
            }
            .main-content {
                flex-wrap: wrap;
                gap: 80rem 40rem;
            }
            
            .pass-mascot {
                right: -30rem;
                width: 220rem;
            }
            .section-right {
                flex: 1 1 100%;
            }

            .bg-mascot-bottom {
                top: 770rem;
                left: 740rem;
                width: 220rem;
            }

            .board-restructure .swiper-slide .btn-pill {
                padding: 10rem 17rem;
                font-size: 18rem;
                height: 60rem;
            }
        }
        @media (max-width: 1024px) {
            html {
                font-size: calc(100vw / 1024);
            }
        }

        /* 전체 레이아웃 모바일 구조 */
        @media (max-width: 767px) {
            html {
                font-size: calc(100vw / 767);
            }
            .container {
                padding-left: 40rem;
                padding-right: 40rem;
            }
            .main-content {
                gap: 60rem;
            }

            .header-links {
                gap: 8rem;
            }
            .header-links .btn-pill {
                height: 40rem;
                padding-left: 16rem;
                padding-right: 16rem;
            }

            .header-links .btn-pill span {
                display: none;
            }

            .bg-mascot-bottom {
                top: 1230rem;
                left: 423rem;
                width: 210rem;
            }
            .section-center-links {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .board-links-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .bottom-banners {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            html {
                font-size: calc(90vw / 480);
            }
            .bg-mascot-bottom {
                top: 1170rem;
                left: 275rem;
                width: 200rem;
            }
            .header-logo img {
                height: 40rem;
            }
            .header-links .btn-pill svg {
                display: none;
            }
            .pass-header {
                height: 80rem;
                border-top-left-radius: 20rem;
                border-top-right-radius: 20rem;
            }
            .pass-body {
                border-bottom-left-radius: 20rem;
                border-bottom-right-radius: 20rem;
            }
            .pass-footer {
                display: none;
            }
            .pass-mascot {
                right: 8rem;
                width: 142rem;
            }
            .pass-buttons {
                grid-template-columns: 1fr;
            }
            .img-checkin {
                height: 40rem;
            }
            .btn-pass {
                height: 60rem;
            }

            .board-links-grid {
                padding: 0;
                border: 0;
                background: none;
            }

            .board-restructure {
                aspect-ratio: auto;
            }
            .board-restructure .swiper-wrapper {
                height: auto;
            }
            .board-restructure .swiper-slide img {
                height: auto;
            }
            .board-restructure .swiper-slide .btn-pill {
                justify-content: flex-end;
                position: static;
                width: 100%;
                border-radius: 0 0 20rem 20rem;
                height: 45rem;
                padding: 10rem 27rem;
                font-size: 16rem;
                margin-top: -6rem;
            }
            .swiper-custom-controls {
                bottom: 0;
                left: 0;
                justify-content: flex-start;
                background: var(--color-secondary);
                height: 45rem;
            }
            .section-right {
                gap: 60rem;
            }
            .link-item span {
                font-size: 16rem;
                line-height: 24rem;
            }
        }
    </style>
</head>

<body>
    <!-- ==================== [Main Layout] ==================== -->
    <!-- ---------------- [Wrapper] ---------------- -->
    <div class="wrap">

        <!-- 하단 마스코트 -->
        <div class="bg-mascot-bottom"></div>

        <!-- ---------------- [Container] ---------------- -->
        <div class="container">

            <!-- ---------------- [Header] ---------------- -->
            <header class="header">
                <div class="header-logo">
                    <img src="./images/img_ajou_logo.png" alt="아주대학교">
                </div>
                <div class="header-links">
                    <a href="#" class="btn-pill dark">
                        <strong>아주대학교</strong> <span>바로가기</span>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.66663 8H13.3333M9.33329 12L13.3333 8L9.33329 4" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>
                    <a href="#" class="btn-pill light">
                        <strong>아주대학교 입학처</strong> <span>바로가기</span>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.66663 8H13.3333M9.33329 12L13.3333 8L9.33329 4" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>
                </div>
            </header>

            <!-- ---------------- [Main Content] ---------------- -->
            <main class="main-content">

                <!-- ---------------- [Left Area : Boarding Pass] ---------------- -->
                <section class="section-boarding-pass">
                    <div class="pass-header">
                        <img src="./images/img_ajou_checkin.png" alt="CHECK-IN AJOU" class="img-checkin">
                        <img src="./images/img_ajou_01.gif" alt="마스코트" class="pass-mascot">
                    </div>
                    <div class="pass-body">
                        <div class="pass-title">
                            2027학년도<br>아주대학교 수시모집
                        </div>
                        <div class="pass-buttons">
                            <button class="btn-pass">원서접수</button>
                            <button class="btn-pass">원서 기재사항 수정요청</button>
                            <button class="btn-pass">지원현황</button>
                            <button class="btn-pass">수시 모집요강</button>
                        </div>
                        <ul class="pass-info-list">

    <script>
        /* ==================== [JavaScript Logic] ==================== */
        /* ---------------- [Event Listeners] ---------------- */
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Ajou University Intro Page Loaded.');

            // Swiper Slider Initialization
            const boardSwiper = new Swiper('.board-swiper', {
                loop: true,
                autoplay: {
                    delay: 4000,
                    disableOnInteraction: false,
                },
                navigation: {
                    nextEl: '.btn-next',
                    prevEl: '.btn-prev',
                },
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
            });

            // Swiper Play/Pause Control
            const playPauseBtn = document.querySelector('.btn-playpause');
            if (playPauseBtn) {
                playPauseBtn.addEventListener('click', () => {
                    if (playPauseBtn.classList.contains('is-playing')) {
                        boardSwiper.autoplay.stop();
                        playPauseBtn.classList.remove('is-playing');
                    } else {
                        boardSwiper.autoplay.start();
                        playPauseBtn.classList.add('is-playing');
                    }
                });
            }
        });
    </script>
